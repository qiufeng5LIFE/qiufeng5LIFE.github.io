<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="我的足迹地图" />
    <title>我的足迹地图</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="./map.css" />
    <style>
      .summary-item { display: inline-flex; align-items: center; gap: 5px; margin-left: 16px; white-space: nowrap; }
      .summary-icon { display: inline-grid; place-items: center; width: 22px; height: 22px; flex: none; border-radius: 50%; color: white; box-shadow: 0 1px 4px #0002; }
      .summary-icon .marker-glyph { width: 13px; height: 13px; }
      .route-style-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-bottom: 8px; padding: 3px; border-radius: 7px; background: #edf0ec; }
      .route-style-switch button { padding: 5px 7px; border: 0; border-radius: 5px; background: transparent; color: #78827b; font-size: 10px; cursor: pointer; white-space: nowrap; }
      .route-style-switch button.active { background: white; color: #263f30; box-shadow: 0 1px 4px #0002; font-weight: 600; }
      .route-style-switch button:disabled { cursor: not-allowed; opacity: .45; }
      .speed-scale[hidden] { display: none; }
      @media (max-width: 600px) { .summary-item { margin-left: 10px; font-size: 11px; } }
    </style>
  </head>
  <body>
    <header><p id="summary">正在载入足迹…</p></header>
    <main><div id="map" aria-label="足迹地图"></div><div id="error" hidden></div></main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="./vendor/leaflet.hotline.min.js"></script>
    <script src="./vendor/extra-markers.bundle.js"></script>
    <script src="./map.js"></script>
  </body>
</html>
